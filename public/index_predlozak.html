<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netflix App</title>

<link rel="stylesheet" href="/styles/style.css">

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script defer src="index.js"></script>
</head>

<body>

<header>
    <h1>Netflix katalog</h1>
</header>

		<nav aria-label="Glavna navigacija">
			<ul class="nav-menu">

				<li class="dropdown">
				<a href="#"> ☰ Menu</a>
				<ul class="submenu">
					<li><a href="/">Početna</a></li>
					<li><a href="/grafikon.html">Grafikoni</a></li>
					<li><a href="/slike">Galerija</a></li>
				</ul>
				</li>

			</ul>
		</nav>

<!-- FILTERI -->
<section class="filters">
    <h2>Filtriranje</h2>

    <input type="text" id="genreFilter" placeholder="Žanr (npr. Drama)">

    <input type="number" id="yearFrom" placeholder="Godina od">
    <input type="number" id="yearTo" placeholder="Godina do">

    <button onclick="filterData()">Filtriraj</button>
</section>

<div class="layout">

<!-- TABLICA -->
<table id="dataTable">
    <thead>
        <tr>
            <th>Naslov</th>
            <th>Tip</th>
            <th>Godina</th>
            <th>Žanr</th>
            <th>Dodaj</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<!-- PLAYLISTA -->
<aside class="playlist">
    <h3>Playlista Filmova</h3>
    <ul id="playlist"></ul>
    <button onclick="savePlaylist()">Spremi</button>
</aside>

</div>

<section class="saved-playlists">
    <h2>📁 Spremljene playliste</h2>
    <div id="savedPlaylists"></div>
</section>

<footer>
    <p>&copy; 2026 Web Programiranje</p>
</footer>

</body>
</html>
